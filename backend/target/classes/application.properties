spring.application.name=backend

# Default profile: H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:codepulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=*

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:}

# Server Port
server.port=${PORT:8080}

# ── Email (SMTP — configurable provider) ──
# Default: Gmail SMTP. Override with Brevo/SendGrid via env vars on Render.
# Brevo: MAIL_HOST=smtp-relay.brevo.com, MAIL_PORT=587
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}

# Sender email (must be verified in Brevo → Senders & IPs)
mail.from=${MAIL_FROM:${spring.mail.username}}

# Frontend URL (used for building reset links)
frontend.url=${FRONTEND_URL:http://localhost:3000}