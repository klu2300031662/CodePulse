# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (important for Neon serverless PostgreSQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 disable
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=${JWT_EXPIRATION:86400000}

# GOOGLE OAUTH (handled manually via /api/auth/google)
google.client.id=${GOOGLE_CLIENT_ID:}

# Frontend URL for password reset links
frontend.url=${FRONTEND_URL:https://code-pulse-iota.vercel.app}

# Logging - show auth errors in Render logs
logging.level.com.codepulse.backend.security=DEBUG
logging.level.com.codepulse.backend.controllers=DEBUG